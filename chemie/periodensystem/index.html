  { n:88, sym:"Ra", name:"Radium", latin:"Radium", cat:"alkaline", period:7, group:2, mass:"[226]", melt:"696°C", boil:"1737°C", density:"5.50 g/cm³", discovery:"1898 (Curie/Curie)", config:"[Rn] 7s²", electronegativity:"0.90", oxidation:"+2", uses:["Historisch: Leuchtzifferblätter","Krebstherapie (hist.)","Forschung"], desc:"Radium wurde von den Curies entdeckt und leuchtet im Dunkeln blaugrün. Es war Jahrzehnte ein Symbol für Radioaktivität und Lebenskraft – Radiumhaltige 'Wundermittel' wurden verkauft, bis die Gefährlichkeit klar wurde. Marie Curie starb wahrscheinlich an Strahlenbelastung.", facts:["Marie Curie starb wahrscheinlich durch Radium","Leuchtet blaugrün im Dunkeln","'Radium Girls': vergiftete Uhrmalerinnen 1920er"] },
  { n:89, sym:"Ac", name:"Actinium", latin:"Actinium", cat:"actinide", period:9, group:3, mass:"[227]", melt:"1050°C", boil:"3200°C", density:"10.07 g/cm³", discovery:"1899 (Debierne)", config:"[Rn] 6d¹ 7s²", electronegativity:"1.10", oxidation:"+3", uses:["Krebstherapie","Neutronenquellen","Forschung"], desc:"Actinium ist der Namensgeber der Actinoide. ²²⁵Ac wird für gezielte Alpha-Therapie bei Krebs eingesetzt. Es ist etwa 150-mal strahlungsaktiver als Radium und leuchtet im Dunkeln blau durch Ionisation der umgebenden Luft.", facts:["Namensgeber der Actinoide","¹⁵⁰× strahlungsaktiver als Radium","Leuchtet blau im Dunkeln (ionisiert Luft)"] },
  { n:90, sym:"Th", name:"Thorium", latin:"Thorium", cat:"actinide", period:9, group:4, mass:"232.0", melt:"1750°C", boil:"4788°C", density:"11.72 g/cm³", discovery:"1829 (Berzelius)", config:"[Rn] 6d² 7s²", electronegativity:"1.30", oxidation:"+4", uses:["Kernenergie","Glühstrümpfe (hist.)","Legierungen","Linsen"], desc:"Thorium-232 kann in Kernreaktoren zu spaltbarem Uran-233 umgewandelt werden – ein alternativer Kernbrennstoffkreislauf. Indien besitzt enorme Thoriumvorkommen und forscht intensiv an Thoriumreaktoren. Es ist nach dem Donnergott Thor benannt.", facts:["Benannt nach dem Gott Thor","Thorium-Reaktoren: intensiv erforscht (vor allem Indien)","Thorium-Glühstrümpfe: frühere Campingbeleuchtung"] },
  { n:91, sym:"Pa", name:"Protactinium", latin:"Protactinium", cat:"actinide", period:9, group:5, mass:"231.0", melt:"1568°C", boil:"4027°C", density:"15.37 g/cm³", discovery:"1917 (Hahn/Meitner/Soddy/Cranston)", config:"[Rn] 5f² 6d¹ 7s²", electronegativity:"1.50", oxidation:"+5, +4", uses:["Forschung","Paläozeanographie"], desc:"Protactinium ist hochradioaktiv und eines der seltensten natürlichen Elemente. Es wurde von Lise Meitner (und anderen) entdeckt. ²³¹Pa wird zur Datierung ozeanischer Sedimente genutzt ('Pa/Th-Verhältnis'). Der Name bedeutet 'vor dem Actinium'.", facts:["Bedeutet 'vor dem Actinium'","Mitentdeckt von Lise Meitner (1917)","²³¹Pa für Meeressediment-Datierung"] },
  { n:92, sym:"U", name:"Uran", latin:"Uranium", cat:"actinide", period:9, group:6, mass:"238.0", melt:"1132°C", boil:"4131°C", density:"19.05 g/cm³", discovery:"1789 (Klaproth)", config:"[Rn] 5f³ 6d¹ 7s²", electronegativity:"1.38", oxidation:"+6, +4", uses:["Kernenergie","Waffen (historisch)","Datierung","Glas"], desc:"Uran-235 ist der wichtigste Kernbrennstoff – durch Neutroneninduzierte Spaltung setzt es enorme Energie frei. Uranium-Glas ('Vaselin-Glas') leuchtet unter UV-Licht grün. Uran war vor der Entdeckung seiner Radioaktivität v.a. als Glasfärber verwendet.", facts:["U-235: Kernbrennstoff in Reaktoren & Bomben","Uranium-Glas leuchtet grün unter UV","Hat 92 Elektronen: schwerstes Naturatom mit stabilen Orbitalen"] },
  { n:93, sym:"Np", name:"Neptunium", latin:"Neptunium", cat:"actinide", period:9, group:7, mass:"[237]", melt:"637°C", boil:"4000°C", density:"20.45 g/cm³", discovery:"1940 (McMillan/Abelson)", config:"[Rn] 5f⁴ 6d¹ 7s²", electronegativity:"1.36", oxidation:"+5, +4, +3", uses:["Neutronendetektoren","Forschung"], desc:"Neptunium war das erste Transuran-Element, künstlich hergestellt (1940) nach der Bestrahlung von Uran mit Neutronen. Es ist nach dem Planeten Neptun benannt (Uran benannt nach Uranus). ²³⁷Np ist der längstlebige Neptunium-Isotop.", facts:["Erstes künstlich hergestelltes Transuranelement","Nach dem Planeten Neptun benannt","²³⁷Np: Halbwertszeit 2,1 Millionen Jahre"] },
  { n:94, sym:"Pu", name:"Plutonium", latin:"Plutonium", cat:"actinide", period:9, group:8, mass:"[244]", melt:"640°C", boil:"3228°C", density:"19.86 g/cm³", discovery:"1940 (Seaborg et al.)", config:"[Rn] 5f⁶ 7s²", electronegativity:"1.28", oxidation:"+6, +5, +4, +3", uses:["Kernwaffen","Kernenergie","Raumsonden (RTG)"], desc:"Plutonium-239 ist das wichtigste Spaltmaterial für Kernwaffen. Es hat die ungewöhnliche Eigenschaft, bei Raumtemperatur in mehreren Phasen zu existieren und sich ausgedehnt anders zu verhalten als erwartet. ²³⁸Pu-Batterien versorgen Raumsonden wie Voyager.", facts:["Kritische Masse: ~10 kg für Kettenreaktion","²³⁸Pu-RTG: Energiequelle von Voyager & New Horizons","6 verschiedene Kristallphasen bei Raumtemperatur"] },
  { n:95, sym:"Am", name:"Americium", latin:"Americium", cat:"actinide", period:9, group:9, mass:"[243]", melt:"1176°C", boil:"2607°C", density:"13.69 g/cm³", discovery:"1944 (Seaborg et al.)", config:"[Rn] 5f⁷ 7s²", electronegativity:"1.13", oxidation:"+3", uses:["Rauchmelder","Forschung"], desc:"Americium findet sich in fast jedem Haushalt – in Ionisationsrauchmeldern. ²⁴¹Am sendet Alpha-Teilchen aus, die eine Ionisationskammer überbrücken; Rauch unterbricht diesen Strom und löst den Alarm aus.", facts:["In Ionisationsrauchmeldern weltweit","²⁴¹Am: Halbwertszeit 432 Jahre","Nach Amerika benannt (Seaborg, 1944)"] },
  { n:96, sym:"Cm", name:"Curium", latin:"Curium", cat:"actinide", period:9, group:10, mass:"[247]", melt:"1340°C", boil:"3110°C", density:"13.51 g/cm³", discovery:"1944 (Seaborg et al.)", config:"[Rn] 5f⁷ 6d¹ 7s²", electronegativity:"1.28", oxidation:"+3", uses:["Raumsonden","Forschung"], desc:"Curium wurde nach Marie und Pierre Curie benannt. ²⁴²Cm wurde auf dem Mars Rover Curiosity als Alpha-Partikel-Quelle für die APXS-Spektrometer eingesetzt. Curium ist stark strahlungsaktiv und gefährlich.", facts:["Nach Marie & Pierre Curie benannt","Im Mars-Rover Curiosity verbaut (APXS)","Einer der stärksten radioaktiven Emitter"] },
  { n:97, sym:"Bk", name:"Berkelium", latin:"Berkelium", cat:"actinide", period:9, group:11, mass:"[247]", melt:"986°C", boil:"2627°C", density:"14.78 g/cm³", discovery:"1949 (Thompson/Ghiorso/Seaborg)", config:"[Rn] 5f⁹ 7s²", electronegativity:"1.30", oxidation:"+4, +3", uses:["Forschung","Herstellung schwerer Elemente"], desc:"Berkelium wurde nach der Stadt Berkeley (Kalifornien) benannt, wo es am Cyclotron hergestellt wurde. Es hat nur radioaktive Isotope und findet keine praktische Anwendung. ²⁴⁹Bk wird als Targetmaterial für die Synthese noch schwererer Elemente genutzt.", facts:["Nach Berkeley, Kalifornien benannt","²⁴⁹Bk: Zielscheibe für Tennessine-Synthese","Nur radioaktive Isotope, keine Anwendungen"] },
  { n:98, sym:"Cf", name:"Californium", latin:"Californium", cat:"actinide", period:9, group:12, mass:"[251]", melt:"900°C", boil:"1745°C", density:"15.10 g/cm³", discovery:"1950 (Thompson et al.)", config:"[Rn] 5f¹⁰ 7s²", electronegativity:"1.30", oxidation:"+3", uses:["Neutronen-Brachytherapie","Sprengstoff-Detektion","Kernreaktoren-Start"], desc:"Californium-252 ist eine intensive Neutronenquelle – eine winzige Menge emittiert Milliarden Neutronen pro Sekunde. Es wird für Neutronenbrachytherapie bei Gebärmutterhalskrebs und für Neutronenmesslogs in der Ölexploration eingesetzt.", facts:["²⁵²Cf: Milliarden Neutronen/Sekunde","Für Gebärmutterhals-Brachytherapie","Extrem teuer: ~27 Millionen $/Gramm"] },
  { n:99, sym:"Es", name:"Einsteinium", latin:"Einsteinium", cat:"actinide", period:9, group:13, mass:"[252]", melt:"860°C", boil:"996°C", density:"8.84 g/cm³", discovery:"1952 (Ghiorso et al.)", config:"[Rn] 5f¹¹ 7s²", electronegativity:"1.30", oxidation:"+3", uses:["Forschung"], desc:"Einsteinium wurde in den Trümmern des ersten Wasserstoffbomben-Tests (Ivy Mike, 1952) entdeckt – ein makabrer Ursprung für ein nach Einstein benanntes Element. Es ist nur in kleinsten Mengen erhältlich und daher kaum untersucht.", facts:["Im Atombomben-Test 'Ivy Mike' entdeckt (1952)","Nach Albert Einstein benannt","Nur Mikrogramm-Mengen je produziert"] },
  { n:100, sym:"Fm", name:"Fermium", latin:"Fermium", cat:"actinide", period:9, group:14, mass:"[257]", melt:"1527°C", boil:"—", density:"—", discovery:"1952 (Ghiorso et al.)", config:"[Rn] 5f¹² 7s²", electronegativity:"1.30", oxidation:"+3", uses:["Forschung"], desc:"Fermium wurde ebenfalls im Ivy-Mike-Bombentest entdeckt und nach Enrico Fermi benannt – dem Erbauer des ersten Kernreaktors. Das schwerste durch Neutronenbestrahlung erreichbare Element. Nur für Grundlagenforschung zugänglich.", facts:["Nach Enrico Fermi benannt","Ebenfalls in Ivy Mike entdeckt","Schwerste neutronenerzeugte Element"] },
  { n:101, sym:"Md", name:"Mendelevium", latin:"Mendelevium", cat:"actinide", period:9, group:15, mass:"[258]", melt:"827°C", boil:"—", density:"—", discovery:"1955 (Ghiorso et al.)", config:"[Rn] 5f¹³ 7s²", electronegativity:"1.30", oxidation:"+3, +2", uses:["Forschung"], desc:"Mendelevium wurde nach Dmitri Mendeleev benannt – dem Schöpfer des Periodensystems. Als erstes Element durch einzelne Ionen synthetisiert. Nur wenige Atome wurden je produziert.", facts:["Nach Dmitri Mendeleev benannt","Erstes via Einzel-Ion-Methode hergestellt","Halbwertszeit ²⁵⁸Md: 51,5 Tage"] },
  { n:102, sym:"No", name:"Nobelium", latin:"Nobelium", cat:"actinide", period:9, group:16, mass:"[259]", melt:"827°C", boil:"—", density:"—", discovery:"1966 (Dubna)", config:"[Rn] 5f¹⁴ 7s²", electronegativity:"1.30", oxidation:"+2, +3", uses:["Forschung"], desc:"Nobelium ist nach Alfred Nobel benannt. Die Entdeckungsgeschichte war umstritten: amerikanische, schwedische und sowjetische Teams beanspruchten sie. Die Synthese erfolgt durch Beschuss von Curium mit Kohlenstoff-Ionen.", facts:["Langwierige Entdeckungsgeschichte (USA, Schweden, UdSSR)","Nach Alfred Nobel benannt","Nur wenige Atome je gemessen"] },
  { n:103, sym:"Lr", name:"Lawrencium", latin:"Lawrencium", cat:"actinide", period:9, group:17, mass:"[266]", melt:"1627°C", boil:"—", density:"—", discovery:"1961 (Ghiorso et al.)", config:"[Rn] 5f¹⁴ 7s² 7p¹", electronegativity:"1.30", oxidation:"+3", uses:["Forschung"], desc:"Lawrencium ist das letzte der Actinoide, benannt nach Ernest O. Lawrence, dem Erfinder des Zyklotrons. Seine Elektronenkonfiguration verhält sich interessanterweise unerwarteter als bei den anderen Actinoiden – Relativitätseffekte spielen eine Rolle.", facts:["Nach Ernest O. Lawrence (Zyklotron-Erfinder)","Letztes Actinoid","Elektronenkonfiguration durch Relativitätseffekte ungewöhnlich"] },
  { n:104, sym:"Rf", name:"Rutherfordium", latin:"Rutherfordium", cat:"transition", period:7, group:4, mass:"[267]", melt:"2100°C", boil:"5500°C", density:"23 g/cm³ (geschätzt)", discovery:"1964/1969", config:"[Rn] 5f¹⁴ 6d² 7s²", electronegativity:"—", oxidation:"+4", uses:["Forschung"], desc:"Rutherfordium ist nach Ernest Rutherford benannt – dem Entdecker des Atomkerns. Es ist das schwerste Element, das Chemiker gut untersuchen konnten. Die Synthese durch Kernfusion erzeugt nur wenige Atome.", facts:["Nach Ernest Rutherford benannt","Chemisch untersucht trotz extremer Seltenheit","Halbwertszeit: ~13 Stunden"] },
  { n:105, sym:"Db", name:"Dubnium", latin:"Dubnium", cat:"transition", period:7, group:5, mass:"[268]", melt:"—", boil:"—", density:"29 g/cm³ (geschätzt)", discovery:"1968/1970", config:"[Rn] 5f¹⁴ 6d³ 7s²", electronegativity:"—", oxidation:"+5", uses:["Forschung"], desc:"Dubnium ist nach der russischen Stadt Dubna benannt – dem Standort des Kernforschungszentrums JINR. Die Synthese war lange Gegenstand politischer Kontroversen zwischen US-amerikanischen und sowjetischen Wissenschaftlern.", facts:["Nach Dubna (Russland) benannt","US-sowjetischer Namensstreit über Jahre","Nur via schwere Ionenbeschleuniger herstellbar"] },
  { n:106, sym:"Sg", name:"Seaborgium", latin:"Seaborgium", cat:"transition", period:7, group:6, mass:"[269]", melt:"—", boil:"—", density:"35 g/cm³ (geschätzt)", discovery:"1974", config:"[Rn] 5f¹⁴ 6d⁴ 7s²", electronegativity:"—", oxidation:"+6", uses:["Forschung"], desc:"Glenn T. Seaborg ist der einzige Mensch, nach dem ein Element benannt wurde, während er noch lebte. Er selbst synthetisierte 10 Transuranelemente. Seaborgium verhält sich chemisch erwartungsgemäß wie Wolfram.", facts:["Einziges Element benannt nach einer lebenden Person (Seaborg)","Seaborg selbst synthetisierte 10 Transurane","Verhält sich wie Wolfram in Verbindungen"] },
  { n:107, sym:"Bh", name:"Bohrium", latin:"Bohrium", cat:"transition", period:7, group:7, mass:"[270]", melt:"—", boil:"—", density:"37 g/cm³ (geschätzt)", discovery:"1981 (GSI Darmstadt)", config:"[Rn] 5f¹⁴ 6d⁵ 7s²", electronegativity:"—", oxidation:"+7", uses:["Forschung"], desc:"Bohrium wurde am GSI Helmholtzzentrum für Schwerionenforschung in Darmstadt synthetisiert und nach Niels Bohr benannt. Es ist ein echter Triumph der deutschen Kernphysik.", facts:["Am GSI Darmstadt synthetisiert (1981)","Nach Niels Bohr benannt","Längstes Isotop: ²⁷⁰Bh mit ~61s Halbwertszeit"] },
  { n:108, sym:"Hs", name:"Hassium", latin:"Hassium", cat:"transition", period:7, group:8, mass:"[277]", melt:"—", boil:"—", density:"41 g/cm³ (geschätzt)", discovery:"1984 (GSI Darmstadt)", config:"[Rn] 5f¹⁴ 6d⁶ 7s²", electronegativity:"—", oxidation:"+8", uses:["Forschung"], desc:"Hassium ist nach dem deutschen Bundesland Hessen benannt (lat. Hassia). Es wurde am GSI Darmstadt entdeckt. Hassiumtetroxid (HsO₄) ist flüchtig und wurde chemisch untersucht – trotz Herstellung von nur wenigen Atomen!", facts:["Nach Hessen (lat. Hassia) benannt","HsO₄: flüchtig und chemisch untersucht","Ebenfalls am GSI Darmstadt entdeckt"] },
  { n:109, sym:"Mt", name:"Meitnerium", latin:"Meitnerium", cat:"transition", period:7, group:9, mass:"[278]", melt:"—", boil:"—", density:"37 g/cm³ (geschätzt)", discovery:"1982 (GSI Darmstadt)", config:"[Rn] 5f¹⁴ 6d⁷ 7s²", electronegativity:"—", oxidation:"+6, +3", uses:["Forschung"], desc:"Meitnerium ist nach Lise Meitner benannt – der Physikerin, die die Kernspaltung erklärte und dafür den Nobelpreis verdient hätte, ihn aber nie erhielt. Eine späte Ehre für eine der größten Physikerinnen der Geschichte.", facts:["Nach Lise Meitner benannt (die 'vergessene' Nobelpreisträgerin)","Lise Meitner erklärte die Kernspaltung (1938)","Am GSI Darmstadt 1982 entdeckt"] },
  { n:110, sym:"Ds", name:"Darmstadtium", latin:"Darmstadtium", cat:"transition", period:7, group:10, mass:"[281]", melt:"—", boil:"—", density:"34 g/cm³ (geschätzt)", discovery:"1994 (GSI Darmstadt)", config:"[Rn] 5f¹⁴ 6d⁸ 7s²", electronegativity:"—", oxidation:"+6, +4, +2", uses:["Forschung"], desc:"Darmstadtium ist nach der deutschen Stadt Darmstadt benannt, wo das GSI Helmholtzzentrum für Schwerionenforschung steht, das es synthetisierte. Damit ist Darmstadt die einzige deutsche Stadt, nach der ein Element benannt ist.", facts:["Nach Darmstadt, Deutschland benannt","GSI Darmstadt: führend in der Entdeckung schwerer Elemente","Nur wenige Atome in seiner Geschichte produziert"] },
  { n:111, sym:"Rg", name:"Roentgenium", latin:"Roentgenium", cat:"transition", period:7, group:11, mass:"[282]", melt:"—", boil:"—", density:"28 g/cm³ (geschätzt)", discovery:"1994 (GSI Darmstadt)", config:"[Rn] 5f¹⁴ 6d¹⁰ 7s¹", electronegativity:"—", oxidation:"+5, +3, +1", uses:["Forschung"], desc:"Roentgenium ist nach Wilhelm Conrad Röntgen benannt – dem Entdecker der Röntgenstrahlung und ersten Träger des Physik-Nobelpreises (1901). Es wurde ebenfalls am GSI Darmstadt synthetisiert.", facts:["Nach Wilhelm Conrad Röntgen benannt","Röntgen erhielt ersten Physik-Nobelpreis (1901)","Darmstadt hat damit 3 Elemente entdeckt"] },
  { n:112, sym:"Cn", name:"Copernicium", latin:"Copernicium", cat:"transition", period:7, group:12, mass:"[285]", melt:"—", boil:"10°C (geschätzt)", density:"23 g/cm³ (geschätzt)", discovery:"1996 (GSI Darmstadt)", config:"[Rn] 5f¹⁴ 6d¹⁰ 7s²", electronegativity:"—", oxidation:"+2", uses:["Forschung"], desc:"Copernicium ist nach Nikolaus Kopernikus benannt. Theoretische Berechnungen sagen voraus, dass es bei Raumtemperatur gasförmig sein könnte – was es zu einem 'Edelgas-ähnlichen Metall' machen würde. Relativistische Effekte dominieren seine Chemie.", facts:["Möglicherweise gasförmig bei Raumtemperatur","Relativistische Quanteneffekte dominieren seine Chemie","Nach Nikolaus Kopernikus benannt"] },
  { n:113, sym:"Nh", name:"Nihonium", latin:"Nihonium", cat:"post-transition", period:7, group:13, mass:"[286]", melt:"430°C (geschätzt)", boil:"1130°C (geschätzt)", density:"16 g/cm³ (geschätzt)", discovery:"2004 (RIKEN, Japan)", config:"[Rn] 5f¹⁴ 6d¹⁰ 7s² 7p¹", electronegativity:"—", oxidation:"+1, +3", uses:["Forschung"], desc:"Nihonium ist das erste Element, das in Asien offiziell entdeckt wurde. Es wurde am RIKEN-Institut in Japan synthetisiert und nach Japan (nihon = Japan auf Japanisch) benannt. Die Entdeckung war ein nationaler Stolz für Japan.", facts:["Erstes asiatisch entdecktes Element (RIKEN, Japan 2004)","'Nihon' = Japan auf Japanisch","Nationaler Stolz für Japan"] },
  { n:114, sym:"Fl", name:"Flerovium", latin:"Flerovium", cat:"post-transition", period:7, group:14, mass:"[289]", melt:"—", boil:"−60°C (geschätzt)", density:"14 g/cm³ (geschätzt)", discovery:"1999 (Dubna, Russland)", config:"[Rn] 5f¹⁴ 6d¹⁰ 7s² 7p²", electronegativity:"—", oxidation:"0, +2", uses:["Forschung"], desc:"Flerovium ist nach dem Flerov Laboratory in Dubna benannt, das nach dem Kernphysiker Georgi Flyorov benannt ist. Trotz seiner Position unter Blei könnte es sich wegen Relativitätseffekten wie ein Edelgas verhalten.", facts:["Verhält sich möglicherweise wie ein Edelgas","Nach Flerov Lab (Dubna) benannt","Nahe an der vorhergesagten 'Insel der Stabilität'"] },
  { n:115, sym:"Mc", name:"Moscovium", latin:"Moscovium", cat:"post-transition", period:7, group:15, mass:"[290]", melt:"400°C (geschätzt)", boil:"1100°C (geschätzt)", density:"13.5 g/cm³ (geschätzt)", discovery:"2003 (Dubna/Livermore)", config:"[Rn] 5f¹⁴ 6d¹⁰ 7s² 7p³", electronegativity:"—", oxidation:"+1, +3", uses:["Forschung"], desc:"Moscovium ist nach dem Moskauer Oblast benannt und wurde in Dubna (Russland) in Zusammenarbeit mit dem Lawrence Livermore National Laboratory (USA) synthetisiert. Es ist Teil der Region nahe der vorhergesagten 'Insel der Stabilität'.", facts:["Nach Oblast Moskau benannt","Russisch-amerikanische Zusammenarbeit","Nahe der 'Insel der Stabilität' (Theorie)"] },
  { n:116, sym:"Lv", name:"Livermorium", latin:"Livermorium", cat:"post-transition", period:7, group:16, mass:"[293]", melt:"364–507°C (geschätzt)", boil:"762–862°C (geschätzt)", density:"12.9 g/cm³ (geschätzt)", discovery:"2000 (Dubna/Livermore)", config:"[Rn] 5f¹⁴ 6d¹⁰ 7s² 7p⁴", electronegativity:"—", oxidation:"−2, +2, +4", uses:["Forschung"], desc:"Livermorium ist nach dem Lawrence Livermore National Laboratory in Livermore, Kalifornien benannt. Es wurde durch Beschuss von Curium-248 mit Calcium-48-Ionen hergestellt. Nur wenige Atome wurden je produziert.", facts:["Nach Lawrence Livermore National Lab benannt","Californium-Curium-Beschuss erzeugt Livermorium","Zerfällt innerhalb von Millisekunden"] },
  { n:117, sym:"Ts", name:"Tennessin", latin:"Tennessine", cat:"halogen", period:7, group:17, mass:"[294]", melt:"400–500°C (geschätzt)", boil:"610°C (geschätzt)", density:"7.17 g/cm³ (geschätzt)", discovery:"2010 (Dubna/Oak Ridge)", config:"[Rn] 5f¹⁴ 6d¹⁰ 7s² 7p⁵", electronegativity:"—", oxidation:"−1, +1, +3, +5", uses:["Forschung"], desc:"Tennessin wurde nach dem US-Bundesstaat Tennessee benannt – Standort des Oak Ridge National Laboratory, Vanderbilt University und University of Tennessee. Es ist das zweitschwere Element und wurde durch Beschuss von Berkelium-249 hergestellt.", facts:["Nach Tennessee, USA benannt","Hergestellt durch Beschuss von ²⁴⁹Bk mit ⁴⁸Ca","Halbwertszeit nur ~51 Millisekunden"] },
  { n:118, sym:"Og", name:"Oganesson", latin:"Oganesson", cat:"noble", period:7, group:18, mass:"[294]", melt:"5±4°C (geschätzt)", boil:"177±10°C (geschätzt)", density:"7 g/cm³ (geschätzt)", discovery:"2002 (Dubna/Livermore)", config:"[Rn] 5f¹⁴ 6d¹⁰ 7s² 7p⁶", electronegativity:"—", oxidation:"−1, 0, +2, +4, +6", uses:["Forschung"], desc:"Oganesson, das bisher schwerste bekannte Element, ist nach dem russischen Kernphysiker Yuri Oganessian benannt – dem einzigen lebenden Menschen außer Seaborg, nach dem ein Element benannt wurde. Obwohl ein Edelgas, sagen Berechnungen voraus, dass es fest und sehr reaktiv wäre.", facts:["Schwerste bekannte Element (118 Protonen)","Nach lebendem Physiker Yuri Oganessian benannt","Obwohl Edelgas: vorhergesagt reaktiv und fest"] }

function filterElements(query) {
  const q = query.toLowerCase().trim();
  const els = document.querySelectorAll('.element');
  els.forEach(el => {
    if (!q) {
      el.classList.remove('highlighted', 'dimmed');
      return;
    }
    const match = el.dataset.name.includes(q) || el.dataset.sym === q || el.dataset.n === q;
    if (match) {
      el.classList.add('highlighted');
      el.classList.remove('dimmed');
    } else {
      el.classList.add('dimmed');
      el.classList.remove('highlighted');
    }
  });
  if (!q) activeCategory = null;
}

function filterByCategory(cat, btn) {
  if (quizActive) return;
  const btns = document.querySelectorAll('.legend-item');
  if (activeCategory === cat) {
    activeCategory = null;
    btns.forEach(b => b.classList.remove('active'));
    document.querySelectorAll('.element').forEach(el => el.classList.remove('highlighted','dimmed'));
    document.getElementById('searchInput').value = '';
    return;
  }
  activeCategory = cat;
  btns.forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  document.getElementById('searchInput').value = '';
  document.querySelectorAll('.element').forEach(el => {
    if (el.dataset.cat === cat) {
      el.classList.add('highlighted'); el.classList.remove('dimmed');
    } else {
      el.classList.add('dimmed'); el.classList.remove('highlighted');
    }
  });
}

// ===== KATEGORIE-FARBEN FÜR SVG =====
const CAT_HEX = {
  alkali:'#ff6b6b', alkaline:'#ffa94d', transition:'#4dabf7',
  'post-transition':'#74c0fc', metalloid:'#63e6be', nonmetal:'#a9e34b',
  halogen:'#dee2e6', noble:'#e599f7', lanthanide:'#ffd43b',
  actinide:'#ff8787', unknown:'#868e96'
};

// ===== ELEKTRONENSCHALEN =====
function getElectronShells(n) {
  const maxPerShell = [2, 8, 18, 32, 32, 18, 8];
  const shells = [];
  let remaining = n;
  for (let i = 0; i < maxPerShell.length && remaining > 0; i++) {
    const fill = Math.min(remaining, maxPerShell[i]);
    shells.push(fill);
    remaining -= fill;
  }
  return shells;
}

function buildShellDiagram(atomicNum, color) {
  const shells = getElectronShells(atomicNum);
  const numShells = shells.length;
  const svgSize = 180;
  const cx = svgSize / 2, cy = svgSize / 2;
  const nucleusR = Math.max(11, 16 - numShells);
  const maxR = svgSize / 2 - 6;
  const spacing = (maxR - nucleusR) / numShells;

  let svg = `<svg viewBox="0 0 ${svgSize} ${svgSize}" width="160" height="160" xmlns="http://www.w3.org/2000/svg">`;

  shells.forEach((_, i) => {
    const r = nucleusR + (i + 1) * spacing;
    svg += `<circle cx="${cx}" cy="${cy}" r="${r.toFixed(1)}" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" stroke-dasharray="3 3"/>`;
  });

  svg += `<circle cx="${cx}" cy="${cy}" r="${nucleusR}" fill="${color}22" stroke="${color}99" stroke-width="1.5"/>`;
  svg += `<text x="${cx}" y="${cy + 4}" text-anchor="middle" fill="${color}" font-size="${nucleusR > 13 ? 10 : 8}" font-family="Space Mono, monospace" font-weight="700">${atomicNum}</text>`;

  shells.forEach((count, i) => {
    const r = nucleusR + (i + 1) * spacing;
    const eR = Math.max(2, Math.min(4, 12 / Math.sqrt(count + 1)));
    for (let j = 0; j < count; j++) {
      const angle = (j / count) * 2 * Math.PI - Math.PI / 2;
      const ex = (cx + r * Math.cos(angle)).toFixed(1);
      const ey = (cy + r * Math.sin(angle)).toFixed(1);
      svg += `<circle cx="${ex}" cy="${ey}" r="${eR}" fill="${color}" opacity="0.85"/>`;
    }
  });

  svg += '</svg>';

  const shellNames = ['K','L','M','N','O','P','Q'];
  const rows = shells.map((count, i) => {
    const dots = Array(Math.min(count, 32)).fill(0).map(() =>
      `<div class="shell-dot" style="background:${color}"></div>`).join('');
    const extra = count > 32 ? `+${count-32}` : '';
    return `<div class="shell-row">
      <span class="shell-name">${shellNames[i]}</span>
      <div class="shell-dots">${dots}</div>
      ${extra ? `<span class="shell-count">${extra}</span>` : ''}
      <span class="shell-count">${count}</span>
    </div>`;
  }).join('');

  return `<div class="shell-diagram-wrap">${svg}<div class="shell-info">${rows}</div></div>`;
}

// ===== HEATMAP =====
let activeHeatmap = null;

function parseHeatmapVal(el, prop) {
  const raw = el[prop];
  if (!raw || raw === '—') return null;
  if (prop === 'mass') {
    const v = parseFloat(raw.replace(/[\[\]]/g, ''));
    return isNaN(v) ? null : v;
  }
  if (prop === 'electronegativity') {
    const v = parseFloat(raw);
    return isNaN(v) ? null : v;
  }
  if (prop === 'melt' || prop === 'boil') {
    const s = raw.replace(/\(.*?\)/g, '').replace(/°C/g, '').trim();
    const part = s.split('±')[0].split('–')[0].split('…')[0].trim();
    const v = parseFloat(part.replace('−', '-').replace(/[^\d.\-]/g, ''));
    return isNaN(v) ? null : v;
  }
  if (prop === 'density') {
    const v = parseFloat(raw.split(' ')[0].replace(',', '.'));
    return isNaN(v) ? null : v;
  }
  return null;
}

function fmtHeatmapVal(val, prop) {
  if (prop === 'melt' || prop === 'boil') return Math.round(val) + '°C';
  if (prop === 'density') return val.toFixed(2);
  if (prop === 'mass') return Math.round(val) + ' u';
  return parseFloat(val.toFixed(2)).toString();
}

function toggleHeatmap(prop, btn) {
  const btns = document.querySelectorAll('.heatmap-btn');
  if (activeHeatmap === prop) {
    activeHeatmap = null;
    btns.forEach(b => b.classList.remove('active'));
    clearHeatmap();
    document.getElementById('heatmapScale').style.display = 'none';
    return;
  }
  activeHeatmap = prop;
  btns.forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  applyHeatmap(prop);
}

function applyHeatmap(prop) {
  const mapped = ELEMENTS.map(el => ({ n: el.n, v: parseHeatmapVal(el, prop) }));
  const nums = mapped.filter(x => x.v !== null).map(x => x.v);
  if (!nums.length) return;
  const min = Math.min(...nums), max = Math.max(...nums);
  const range = max - min || 1;

  document.getElementById('heatmapMin').textContent = fmtHeatmapVal(min, prop);
  document.getElementById('heatmapMax').textContent = fmtHeatmapVal(max, prop);
  document.getElementById('heatmapScale').style.display = 'flex';

  document.querySelectorAll('.element').forEach(domEl => {
    const n = parseInt(domEl.dataset.n);
    const entry = mapped.find(x => x.n === n);
    if (!entry || entry.v === null) {
      domEl.style.background = '#14161e';
      return;
    }
    const ratio = (entry.v - min) / range;
    const hue = Math.round(220 - ratio * 220);
    domEl.style.background = `hsl(${hue}, 70%, 22%)`;
  });
}

function clearHeatmap() {
  document.querySelectorAll('.element').forEach(el => { el.style.background = ''; });
}

// ===== QUIZ =====
let quizActive = false, quizCorrect = 0, quizTotal = 0, quizCurrentEl = null, quizAnswered = false;

function startQuiz() {
  if (activeHeatmap) {
    const activeBtn = document.querySelector('.heatmap-btn.active');
    if (activeBtn) toggleHeatmap(activeHeatmap, activeBtn);
  }
  closeModal();
  quizActive = true; quizCorrect = 0; quizTotal = 0; quizAnswered = false;
  document.getElementById('quizBar').classList.add('active');
  document.getElementById('periodicGrid').classList.add('quiz-mode');
  document.getElementById('searchInput').value = '';
  document.getElementById('searchInput').disabled = true;
  document.querySelectorAll('.element').forEach(el => el.classList.remove('highlighted','dimmed'));
  document.querySelectorAll('.legend-item').forEach(b => b.classList.remove('active'));
  activeCategory = null;
  updateQuizScore();
  nextQuestion();
}

function stopQuiz() {
  quizActive = false;
  document.getElementById('quizBar').classList.remove('active');
  document.getElementById('periodicGrid').classList.remove('quiz-mode');
  document.getElementById('searchInput').disabled = false;
  document.getElementById('quizFeedback').className = 'quiz-feedback';
  document.querySelectorAll('.element').forEach(el => el.classList.remove('quiz-flash-ok','quiz-flash-err'));
  quizCurrentEl = null;
}

function nextQuestion() {
  quizAnswered = false;
  document.getElementById('quizFeedback').className = 'quiz-feedback';
  quizCurrentEl = ELEMENTS[Math.floor(Math.random() * ELEMENTS.length)];
  document.getElementById('quizTarget').textContent = quizCurrentEl.name;
}

function handleQuizAnswer(el, domEl) {
  if (!quizActive || quizAnswered) return;
  quizAnswered = true;
  quizTotal++;
  const fb = document.getElementById('quizFeedback');
  if (el.n === quizCurrentEl.n) {
    quizCorrect++;
    domEl.classList.add('quiz-flash-ok');
    fb.textContent = '✓ Richtig!';
    fb.className = 'quiz-feedback correct';
    setTimeout(() => { domEl.classList.remove('quiz-flash-ok'); updateQuizScore(); nextQuestion(); }, 800);
  } else {
    domEl.classList.add('quiz-flash-err');
    const correctDom = document.querySelector(`[data-n="${quizCurrentEl.n}"]`);
    if (correctDom) correctDom.classList.add('quiz-flash-ok');
    fb.textContent = `✗ Falsch – gesucht: ${quizCurrentEl.name} (${quizCurrentEl.sym})`;
    fb.className = 'quiz-feedback wrong';
    setTimeout(() => {
      domEl.classList.remove('quiz-flash-err');
      if (correctDom) correctDom.classList.remove('quiz-flash-ok');
      updateQuizScore();
      nextQuestion();
    }, 1800);
  }
}

function updateQuizScore() {
  document.getElementById('quizCorrectCount').textContent = quizCorrect;
  document.getElementById('quizTotalCount').textContent = quizTotal;
}

buildGrid();

function applyScale() {
  var root = document.getElementById('scale-root');
  root.style.zoom = '';
  var natural = root.scrollWidth;
  var scale = Math.min(1, window.innerWidth / natural);
  root.style.zoom = scale;
  root.style.height = Math.ceil(window.innerHeight / scale) + 'px';
}
applyScale();
window.addEventListener('resize', applyScale);
</script>
